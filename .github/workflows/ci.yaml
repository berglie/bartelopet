name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npm run type-check
        env:
          SKIP_ENV_VALIDATION: true

      - name: Lint
        run: npm run lint
        env:
          SKIP_ENV_VALIDATION: true

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Pinned: supabase/config.toml relies on auto_expose_new_tables, which newer CLIs drop.
          version: 2.109.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Anonymous pulls from public.ecr.aws and ghcr.io hit shared rate limits on GitHub runners.
      # Pull the Supabase images from ghcr.io with the job token instead.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io throttles the large postgres image on every attempt, so take it from Docker Hub
      # and tag it with the name the CLI expects. The version follows the pinned CLI above.
      - name: Pull Postgres image from Docker Hub
        run: |
          docker pull supabase/postgres:17.6.1.143
          docker tag supabase/postgres:17.6.1.143 ghcr.io/supabase/postgres:17.6.1.143

      - name: Start local Supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        # Realtime is unused, and postgres-meta only serves Studio. ghcr.io still throttles at
        # times and the CLI only retries for a few seconds, so retry with longer pauses. Images
        # pulled by an earlier attempt are kept.
        run: |
          for attempt in 1 2 3 4 5; do
            supabase start -x studio,edge-runtime,logflare,vector,imgproxy,pooler,realtime,postgres-meta && exit 0
            echo "supabase start failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
