name: Claude Code Review

on:
  pull_request:
    # Once on create / ready — not on every push (synchronize)
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to review (uses latest PR or diff against main)'
        required: true
        type: string
      model:
        description: 'Claude model to use'
        type: choice
        default: claude-sonnet-5
        options:
          - claude-sonnet-5
          - claude-opus-5-5
          - claude-sonnet-4-6
          - claude-opus-4-6

# One review per PR/branch at a time; a newer request replaces a running one.
# Concurrency is evaluated before the job `if`, so unrelated PR comments (e.g. Vercel bot)
# get their own group instead of cancelling a running review.
concurrency:
  group: claude-review-${{ (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '@claude review')) && format('ignored-{0}', github.run_id) || (github.event.pull_request.number || github.event.issue.number || github.event.inputs.branch) }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    # The real cost guard; --max-turns below is only a runaway backstop.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Resolve PR and branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Branch names are user-controlled; pass them via env, never inline.
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pr_number=${EVENT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            BRANCH=$(gh pr view "$EVENT_PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
            echo "pr_number=${EVENT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$INPUT_BRANCH" --json number --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch=${INPUT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          # Full history is only needed to diff against main when there is no PR.
          fetch-depth: ${{ steps.pr.outputs.pr_number && 1 || 0 }}

      # Pre-fetch the review context so Claude does not spend turns on it.
      - name: Prepare review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          mkdir -p .claude-review
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json number,title,body,author,baseRefName,headRefName,files \
              > .claude-review/pr.json
            gh pr diff "$PR_NUMBER" --repo "$REPO" > .claude-review/pr.diff
          else
            git diff origin/main...HEAD > .claude-review/pr.diff
            git diff --stat origin/main...HEAD > .claude-review/pr.stat
          fi
          wc -l .claude-review/pr.diff

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ steps.pr.outputs.branch }}
            PR NUMBER: ${{ steps.pr.outputs.pr_number || 'N/A' }}

            The branch is already checked out in the working directory, and the
            review context is already fetched — do not re-fetch it:
            - `.claude-review/pr.diff`: the full diff to review
            - `.claude-review/pr.json`: PR title, description and changed files (PR runs only)

            Read `AGENTS.md`, `REVIEW.md` and the diff, then open
            surrounding code only where a change needs more context.

            Review priorities:
            - Behavioral regressions
            - Correctness bugs
            - Security concerns
            - Auth, admin access, and RLS issues
            - Personal data exposure (GDPR)
            - Missing tests for risky changes

            Prefer concise, high-signal findings over praise or broad style feedback.
            Only report issues introduced by this change.

            You have a limited turn budget. Batch independent reads into one step
            and post your review before the budget runs out; a posted partial review
            is better than none.

            ${{ steps.pr.outputs.pr_number && 'Post exactly one top-level review comment with `gh pr comment`. For specific lines, you may also use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`. Only post GitHub comments; do not reply with the review as a message.' || format('There is no open PR for branch `{0}`. Review the diff against `main` and print the review to stdout.', steps.pr.outputs.branch) }}
          claude_args: >-
            --model ${{ github.event.inputs.model || 'claude-sonnet-5' }}
            --max-turns 60
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"

      - name: Report failed review
        if: failure() && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.pr_number }}" --repo "${{ github.repository }}" \
            --body "⚠️ Claude review did not complete. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. Comment \`@claude review\` to retry."
